name: FourNations Structural Outputs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'empirical/**'
      - 'data/raw/nuclear_onsets_seed.csv'
      - 'data/raw/nuclear_onset_scenarios.csv'
      - 'data/raw/sovereign_rating_events.csv'
      - 'tests/**'
      - '.github/workflows/fournations-structural-outputs.yml'

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest

      - name: Run FourNations structural-output generator
        run: |
          python empirical/run_fournations_structural_outputs.py \
            --base-dir "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/results"
          echo "Generated files:"
          find "$GITHUB_WORKSPACE/results" -maxdepth 1 -type f -print

      - name: Validate generated artifacts
        run: |
          ls -la "$GITHUB_WORKSPACE/results"
          test -f "$GITHUB_WORKSPACE/results/genuine_panel_documented_scenarios.csv"
          test -f "$GITHUB_WORKSPACE/results/fournations_cardinality_invariance.csv"
          test -f "$GITHUB_WORKSPACE/results/fournations_classification_changes.csv"
          test -f "$GITHUB_WORKSPACE/results/fournations_years.csv"
          python - <<'PY'
          import os
          import pandas as pd
          root = os.environ['GITHUB_WORKSPACE']
          for name in [
              'genuine_panel_documented_scenarios.csv',
              'fournations_cardinality_invariance.csv',
              'fournations_classification_changes.csv',
              'fournations_years.csv',
          ]:
              path = os.path.join(root, 'results', name)
              df = pd.read_csv(path)
              if df.empty:
                  raise SystemExit(f'Generated artifact is empty: {path}')
          PY

      - name: Upload structural-output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fournations-structural-outputs
          path: |
            ${{ github.workspace }}/results/genuine_panel_documented_scenarios.csv
            ${{ github.workspace }}/results/fournations_cardinality_invariance.csv
            ${{ github.workspace }}/results/fournations_classification_changes.csv
            ${{ github.workspace }}/results/fournations_years.csv
          if-no-files-found: error
